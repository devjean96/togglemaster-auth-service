name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [ -n "$unformatted_files" ]; then
            echo "The following files must be formatted with gofmt:"
            echo "$unformatted_files"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build application
        run: go build -o bin/auth-service .

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SAST with gosec
        uses: securego/gosec@v2.28.0
        with:
          args: "-severity high -confidence medium ./..."

      - name: SCA with Trivy — block critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table

  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag togglemaster-auth-service:${{ github.sha }} .
